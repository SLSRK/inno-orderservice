spring.application.name=orderservice

spring.liquibase.change-log=db.changelog/db.changelog-master.xml

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orderservice}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6380}

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=order-group-v2
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.innowise.orderservice.model.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.innowise.orderservice.model.dto.PaymentStatusDto
spring.kafka.consumer.properties.spring.json.use.type.headers=false

jwt.secret=${JWT_SECRET}
user.service.url=${USERSERVICE_URL:http://userservice:8080}